services:
  - type: web
    name: trading-intelligence-web
    runtime: docker
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading-intelligence-db
          property: connectionString
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SIGNAL_MIN_WINRATE
        value: "60"
      - key: PAPER_TRADING
        value: "true"
      - key: MIN_BACKTEST_TRADES
        value: "30"
      - key: SCAN_INTERVAL_SECONDS
        value: "300"

databases:
  - name: trading-intelligence-db
    plan: free
