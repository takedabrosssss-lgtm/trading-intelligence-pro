services:
  - type: web
    name: trading-intelligence-web
    runtime: docker
    plan: starter
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading-intelligence-db
          property: connectionString
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
  - type: worker
    name: trading-intelligence-worker
    runtime: docker
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading-intelligence-db
          property: connectionString
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: SIGNAL_MIN_WINRATE
        value: "60"
      - key: PAPER_TRADING
        value: "true"
databases:
  - name: trading-intelligence-db
    plan: basic-256mb
