
services:
  - type: web
    name: trading-intelligence-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trading-intelligence-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: MINI_APP_URL
        value: https://trading-intelligence-web.onrender.com
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: trading-intelligence-db
    plan: free
    databaseName: trading_intelligence
    user: trading_intelligence
    
